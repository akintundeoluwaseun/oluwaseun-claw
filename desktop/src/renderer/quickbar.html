<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Claw quick bar</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="quickbar.css">
</head>
<body data-mode="collapsed" data-phase="idle">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="claw-mark" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="mk-g" x1="14" y1="10" x2="50" y2="56" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset=".28" stop-color="#9DB4FF"/>
          <stop offset=".5" stop-color="#FFFFFF"/><stop offset=".72" stop-color="#AE93FF"/>
          <stop offset="1" stop-color="#36479B"/>
        </linearGradient>
        <linearGradient id="mk-e" x1="20" y1="8" x2="40" y2="52" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#BFD2FF"/>
        </linearGradient>
        <radialGradient id="mk-b" cx="32" cy="32" r="27" gradientUnits="userSpaceOnUse">
          <stop offset=".3" stop-color="#6E8BFF" stop-opacity=".92"/><stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect class="mk-tile" width="64" height="64" rx="15" fill="#0E0F12"
            style="fill: var(--mk-tile-fill, #0E0F12)"/>
      <circle class="mk-ring" cx="32" cy="32" r="22" fill="none" stroke="#7E9BFF" stroke-width="2" opacity="0"/>
      <circle class="mk-bloom" cx="32" cy="32" r="27" fill="url(#mk-b)"/>
      <g class="mk-blades"><path d="M32 9.5c8.6 3.4 14.8 9.6 18.4 18.6-5.8-4.6-12.2-6.8-19.2-6.6 2.6-3.8 2.9-7.8.8-12z" transform="rotate(0 32 32)" fill="url(#mk-g)"/><path d="M32 9.5c8.6 3.4 14.8 9.6 18.4 18.6-5.8-4.6-12.2-6.8-19.2-6.6 2.6-3.8 2.9-7.8.8-12z" transform="rotate(120 32 32)" fill="url(#mk-g)"/><path d="M32 9.5c8.6 3.4 14.8 9.6 18.4 18.6-5.8-4.6-12.2-6.8-19.2-6.6 2.6-3.8 2.9-7.8.8-12z" transform="rotate(240 32 32)" fill="url(#mk-g)"/><path d="M32 9.5c2.1 4.2 1.8 8.2-.8 12-3.4.1-6.6.7-9.6 1.8 3.4-5.6 6.9-10.2 10.4-13.8z" transform="rotate(0 32 32)" fill="url(#mk-e)" opacity=".92"/><path d="M32 9.5c2.1 4.2 1.8 8.2-.8 12-3.4.1-6.6.7-9.6 1.8 3.4-5.6 6.9-10.2 10.4-13.8z" transform="rotate(120 32 32)" fill="url(#mk-e)" opacity=".92"/><path d="M32 9.5c2.1 4.2 1.8 8.2-.8 12-3.4.1-6.6.7-9.6 1.8 3.4-5.6 6.9-10.2 10.4-13.8z" transform="rotate(240 32 32)" fill="url(#mk-e)" opacity=".92"/></g>
    </symbol>
  </svg>

  <button class="pill" id="pill" type="button" aria-label="Give Claw a task">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#claw-mark"/></svg>
    <span class="pill-text" id="pill-text">Ask Claw</span>
    <span class="pill-meta" id="pill-meta"></span>
  </button>
  <button class="pill-hide" id="pill-hide" type="button" aria-label="Hide the bar"
          title="Hide the bar (Ctrl+Shift+Space brings it back)">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 5 6 6M11 5l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
  </button>
  <button class="pill-stop" id="pill-stop" type="button" aria-label="Stop the current task" title="Stop">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
  </button>

  <form class="panel" id="panel" autocomplete="off">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#claw-mark"/></svg>
    <label class="sr-only" for="task">Task for Claw</label>
    <input id="task" type="text" maxlength="4000" spellcheck="true" placeholder="Give Claw a task, then get on with your day">
    <button class="mic" id="mic" type="button" aria-label="Dictate a task" title="Dictate">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 1.5a2 2 0 0 0-2 2v4a2 2 0 1 0 4 0v-4a2 2 0 0 0-2-2z"/>
        <path d="M3.5 7a.5.5 0 0 1 1 0 3.5 3.5 0 0 0 7 0 .5.5 0 0 1 1 0 4.5 4.5 0 0 1-4 4.47V13h2a.5.5 0 0 1 0 1H5.5a.5.5 0 0 1 0-1h2v-1.53A4.5 4.5 0 0 1 3.5 7z"/>
      </svg>
      <span class="mic-dot" aria-hidden="true"></span>
    </button>
    <button class="run" id="run" type="submit" disabled>Start</button>
    <p class="listening" id="listening" hidden>
      <span class="listening-dot" aria-hidden="true"></span>
      <span id="listening-text">Listening…</span>
      <button class="link" id="mic-cancel" type="button">Cancel</button>
    </p>
    <p class="panel-foot" id="panel-foot">
      <span id="foot-text">Claw asks before it saves files or changes anything online.</span>
      <button class="link" id="open-app" type="button">Open Claw</button>
    </p>
  </form>
  <script src="quickbar.js"></script>
</body>
</html>
