# Runs the challenge benchmark (scripts/challenge_bench.py) against a published release with one real brain
# on a clean Windows machine: install, import the brain from the release files, run every challenge,
# score it, and push the full report to the ci-evidence branch (benchmarks/<tag>-<brain>-<run>).
name: Challenge benchmark

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to benchmark"
        type: string
        required: true
      brain:
        description: "Light, Standard or Pro"
        type: string
        default: "Standard"
      only:
        description: "Optional: comma-separated scenario ids"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUTF8: "1"
      TOKEN: release-check-token-0123456789abcdef0123
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Download the release (installer + every brain file)
        run: |
          New-Item -ItemType Directory -Force D:\rel | Out-Null
          gh release download "${{ inputs.tag }}" --dir D:\rel --pattern "*Setup.exe" --pattern "S-CLAW-Brain-${{ inputs.brain }}-*"
          Get-ChildItem D:\rel | ForEach-Object { Write-Output "::notice title=Downloaded::$($_.Name) $([math]::Round($_.Length/1MB)) MB" }

      - name: Install silently, as a normal user
        run: |
          $setup = Get-ChildItem D:\rel -Filter *Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/DIR=D:\S-CLAW' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path D:\S-CLAW\S-CLAW.exe)) { Write-Output "::error title=Install failed::exit $($p.ExitCode)"; exit 1 }
          Write-Output "::notice title=Installed::D:\S-CLAW ($([math]::Round((Get-ChildItem D:\S-CLAW -Recurse | Measure-Object Length -Sum).Sum/1MB)) MB)"

      - name: Start the installed app and check its window and backend come up
        run: |
          $app = Start-Process D:\S-CLAW\S-CLAW.exe -PassThru
          $title = ''; $backend = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            $w = Get-Process S-CLAW -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | Select-Object -First 1
            if ($w) { $title = $w.MainWindowTitle }
            $backend = [bool](Get-Process claw-backend -ErrorAction SilentlyContinue)
            if ($title -and $backend) { break }
          }
          Write-Output "::notice title=App started::window '$title', backend running: $backend"
          Get-Process S-CLAW, claw-backend -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $title -or -not $backend) { Write-Output "::error title=App did not start::window '$title', backend $backend"; exit 1 }

      - name: Run the benchmark
        run: |
          trap { Write-Output "::error title=Benchmark failed::$($_.Exception.Message) at line $($_.InvocationInfo.ScriptLineNumber)"; exit 1 }
          python -m pip install -q openpyxl av pypdf
          $brain = "${{ inputs.brain }}"
          $env:CLAW_RESOURCES = 'D:\S-CLAW\resources'
          $env:CLAW_SESSION_TOKEN = $env:TOKEN
          $env:CLAW_DATA_DIR = "D:\data-$brain"
          $port = 18810
          $proc = Start-Process D:\S-CLAW\resources\backend\claw-backend.exe -ArgumentList '--port', $port -PassThru -RedirectStandardError "D:\be.err" -RedirectStandardOutput "D:\be.out"
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod "http://127.0.0.1:$port/health" | Out-Null; break } catch { Start-Sleep 1 } }
          $h = @{ 'X-Claw-Token' = $env:TOKEN }
          $first = Get-ChildItem D:\rel -Filter "S-CLAW-Brain-$brain-*.gguf" | Where-Object { $_.Name -notmatch 'mmproj' -and ($_.Name -match '-00001-of-' -or $_.Name -notmatch '-\d{5}-of-') } | Select-Object -First 1
          $r = Invoke-RestMethod -Method Post "http://127.0.0.1:$port/brain/import" -Headers $h -ContentType 'application/json' -Body (@{ path = $first.FullName } | ConvertTo-Json)
          Write-Output "::notice title=Brain::$($r.active.name), vision file: $([bool]$r.active.mmproj_file)"
          New-Item -ItemType Directory -Force bench-report | Out-Null
          python scripts\challenge_bench.py --port $port --token $env:TOKEN --out bench-report --only "${{ inputs.only }}" *>&1 | Tee-Object bench-report\console.txt
          $rep = Get-Content bench-report\benchmark.json -Raw | ConvertFrom-Json
          $s = $rep.summary
          Write-Output "::notice title=Benchmark ($brain)::average $($s.average_score)/100, PASS $($s.pass), PARTIAL $($s.partial), FAIL $($s.fail), false completions $([math]::Round($s.false_completion_rate*100))%, avg $($s.average_seconds)s"
          $lines = ($rep.scenarios | ForEach-Object { "$($_.id) $($_.verdict) $($_.score)" }) -join ' | '
          Write-Output "::notice title=Scenarios::$lines"
          Copy-Item "D:\data-$brain\logs\claw.log" bench-report\claw.log -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -Force
          Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Publish the evidence
        if: always()
        run: |
          $dest = "benchmarks/${{ inputs.tag }}-${{ inputs.brain }}-$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ev\$dest" | Out-Null
          Copy-Item bench-report\* "$env:RUNNER_TEMP\ev\$dest" -Recurse -ErrorAction SilentlyContinue
          Copy-Item D:\be.err "$env:RUNNER_TEMP\ev\$dest" -ErrorAction SilentlyContinue
          cd "$env:RUNNER_TEMP\ev"
          git init -q; git config user.name "s-claw-check"; git config user.email "check@users.noreply.github.com"
          git remote add origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY"
          git fetch -q origin ci-evidence 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -q -b ci-evidence FETCH_HEAD } else { git checkout -q -b ci-evidence }
          git add -A; git commit -q -m "Benchmark ${{ inputs.tag }} ${{ inputs.brain }} ($env:GITHUB_RUN_NUMBER)"; git push -q origin ci-evidence
