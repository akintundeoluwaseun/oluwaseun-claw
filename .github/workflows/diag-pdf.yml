# Temporary diagnostic: reproduce the Windows-only PDF text-extraction failure and
# report the raw extraction as a readable annotation. Delete once the bug is fixed.
name: Diag PDF text

on:
  workflow_dispatch:
  push:
    branches: ["claude/ecstatic-ritchie-x6ao14"]
    paths: [".github/workflows/diag-pdf.yml", "backend/claw/**", "backend/tests/test_documents.py"]

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m playwright install chromium

      - name: Raw pdfium extraction on Windows
        shell: python
        working-directory: backend
        run: |
          import sys, tempfile, pathlib, importlib.metadata as md
          sys.path.insert(0, ".")
          from tests.test_documents import make_pdf
          import pypdfium2 as pdfium

          out = []
          out.append("pypdfium2=" + md.version("pypdfium2"))
          out.append("pypdf=" + md.version("pypdf"))
          d = pathlib.Path(tempfile.mkdtemp()); p = d / "report.pdf"
          make_pdf(p, "Quarterly sales grew 12 percent")
          doc = pdfium.PdfDocument(str(p)); pg = doc[0]; tp = pg.get_textpage()
          bounded = tp.get_text_bounded()
          rng = tp.get_text_range()
          out.append("bounded=" + repr(bounded))
          out.append("range=" + repr(rng))
          out.append("n_chars=%d" % tp.count_chars())
          import pypdf
          out.append("pypdf_text=" + repr(pypdf.PdfReader(str(p)).pages[0].extract_text()))
          boxes = []
          for k in range(tp.count_chars()):
              try:
                  b = tp.get_charbox(k)
                  boxes.append("%s%s" % (repr(rng[k]) if k < len(rng) else "?",
                                         "Z" if round(b[1], 2) == round(b[3], 2) else ""))
              except Exception as e:
                  boxes.append("ERR")
          out.append("chars(Z=zero-height)=" + "".join(boxes))
          print("::notice title=pdfium raw::" + " | ".join(out))
          # Also run the pipeline itself
          from claw.documents.pdf_pipeline import PdfPipeline
          res = PdfPipeline(d / "cache").read(p)
          pg0 = res.pages[0]
          print("::notice title=pipeline::source=%s status=%s text=%s" % (pg0.source, pg0.status, repr(pg0.text)))

      - name: The actual failing test
        shell: pwsh
        working-directory: backend
        continue-on-error: true
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_documents.py -rfE 2>&1 | Tee-Object out.txt
          $sum = (Get-Content out.txt | Select-String -Pattern '^(FAILED|ERROR) |passed|failed' | Select-Object -Last 6 | ForEach-Object { $_.Line }) -join ' | '
          Write-Output "::notice title=test_documents::$sum"
