[project]
name = "oluwaseun-claw-backend"
version = "0.4.0"
description = "Local agent runtime for Oluwaseun Claw, a local-first Windows computer-control agent"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
